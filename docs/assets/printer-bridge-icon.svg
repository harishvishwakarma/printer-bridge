      <rect x="326" y="514" width="372" height="20" rx="10" fill="#0A62D4"/>
      <circle cx="742" cy="618" r="25" fill="#4BE3A4"/>
      <circle cx="742" cy="618" r="13" fill="#C5FFE7"/>
