    <filter id="soft-shadow" x="104" y="112" width="816" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#063A90" flood-opacity="0.34"/>
    </filter>
