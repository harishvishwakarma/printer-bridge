<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Printer Bridge</title>
  <desc id="description">A sheet of paper passing across a white bridge on a blue app icon.</desc>
  <defs>
    <linearGradient id="tile" x1="156" y1="96" x2="852" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#61A8FF"/>
      <stop offset="0.48" stop-color="#1478F2"/>
      <stop offset="1" stop-color="#0754C7"/>
    </linearGradient>
    <linearGradient id="paper" x1="512" y1="216" x2="512" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="bridge" x1="512" y1="448" x2="512" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEEFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(330 216) rotate(49) scale(704)" gradientUnits="userSpaceOnUse">
