      <path fill-rule="evenodd" clip-rule="evenodd" d="M226 470C226 446 246 426 270 426H754C778 426 798 446 798 470V755C798 780 778 800 754 800H691V673C691 574 611 494 512 494C413 494 333 574 333 673V800H270C246 800 226 780 226 755V470ZM426 800V673C426 626 465 587 512 587C559 587 598 626 598 673V800H426Z" fill="url(#bridge)"/>
